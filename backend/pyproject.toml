[tool.ruff]
target-version = "py312"
line-length = 79
indent-width = 4
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
# Syntax/style errors, unused imports and variables, and deterministic import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "pricing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
